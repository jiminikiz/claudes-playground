# Mirrors sand/ to github.com/jiminikiz/sand on every push to main that touches it.
# It copies the folder over a clone of that repo rather than using `git subtree
# push`, whose split drags in the playground's history from before sand/ was a
# subtree. It stops if the sand repo changed on its own since the last mirror:
# pull those changes in first (`git subtree pull`, see .claude/rules/projects.md).
name: mirror sand

on:
  push:
    branches: [main]
    paths: ['sand/**']

concurrency: mirror-sand

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the sand repo
        env:
          SAND_DEPLOY_KEY: ${{ secrets.SAND_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SAND_DEPLOY_KEY" > ~/.ssh/sand
          chmod 600 ~/.ssh/sand
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/sand -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/sand -o IdentitiesOnly=yes" git clone git@github.com:jiminikiz/sand.git "$RUNNER_TEMP/sand"

      - name: Check the sand repo hasn't moved on its own
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          theirs=$(git -C "$RUNNER_TEMP/sand" rev-parse 'HEAD^{tree}')
          ours=$(git rev-parse "$BEFORE:sand" 2>/dev/null || true)
          now=$(git rev-parse 'HEAD:sand')
          if [ "$theirs" = "$now" ]; then echo "already in step"; exit 0; fi
          if [ "$theirs" != "$ours" ]; then
            echo "::error::jiminikiz/sand has commits the playground doesn't. Run git subtree pull --prefix=sand https://github.com/jiminikiz/sand main --squash, then push again."
            exit 1
          fi

      - name: Copy sand/ over and push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          rsync -a --delete --exclude .git sand/ "$RUNNER_TEMP/sand/"
          msg=$(git log --reverse --format='%s%n%n%b' "$BEFORE..HEAD" -- sand)
          author=$(git log -1 --format='%an <%ae>' -- sand)
          cd "$RUNNER_TEMP/sand"
          git add -A
          if git diff --cached --quiet; then echo "nothing to mirror"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --author="$author" -m "$msg" -m "Mirrored from jiminikiz/claudes-playground@${GITHUB_SHA::7}."
          git push origin HEAD:main
